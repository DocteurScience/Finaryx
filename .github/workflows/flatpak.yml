# Builds the Flatpak with the publication manifest (offline: crates from
# build-aux/cargo-sources.json), on the checked-out commit instead of the
# release tag, and the Snap (snap/snapcraft.yaml). Both are kept as
# artifacts of the run and, when publishing, attached to the release.
#
# Publishing a version: Actions > Flatpak et Snap > Run workflow on main.
# A manual run always publishes the version of Cargo.toml (tag
# v<version>): once both packages are built, it creates the tag and the
# release (text: .github/release-notes.md) and attaches them. It is
# started by hand by the owner, never by a Claude session.
name: Flatpak et Snap

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Mode
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "::notice title=Publication::Version v$version : elle sera publiée une fois le Flatpak et le Snap construits."
          else
            echo "Build only ($GITHUB_EVENT_NAME)."
          fi

      - name: Manifest for this commit
        run: |
          python3 - <<'PY'
          import json
          src = "build-aux/io.github.docteurscience.Finaryx.json"
          m = json.load(open(src))
          for module in m["modules"]:
              if module["name"] == "finaryx":
                  module["sources"] = [{"type": "dir", "path": ".."}, "cargo-sources.json"]
          json.dump(m, open("build-aux/ci.json", "w"), indent=2)
          PY

      # The preinstalled runtimes sit in a read-only layer of the image;
      # overlayfs cannot rename their directories when flatpak updates
      # them ("Invalid cross-device link", then exit code 139). A copy in
      # the writable layer can be updated: flatpak uses it through
      # FLATPAK_SYSTEM_DIR (the image has no `mount`).
      - name: Writable Flatpak installation
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak-rw
          echo "FLATPAK_SYSTEM_DIR=/var/lib/flatpak-rw" >> "$GITHUB_ENV"

      # Should the update still fail: one more attempt.
      - id: build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        continue-on-error: true
        with:
          bundle: finaryx.flatpak
          manifest-path: build-aux/ci.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Build again after a failed attempt
        if: steps.build.outcome == 'failure'
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: finaryx.flatpak
          manifest-path: build-aux/ci.json
          cache-key: flatpak-builder-${{ github.sha }}-retry

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: finaryx.flatpak

  snap:
    name: Snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: snapcraft
        uses: snapcore/action-build@v1

      - name: Name of the file
        run: mv "${{ steps.snapcraft.outputs.snap }}" finaryx.snap

      # What the application needs at run time: launcher, compiled
      # settings schema, translations, metadata.
      - name: Check the snap content
        run: |
          command -v unsquashfs >/dev/null || sudo apt-get install -y squashfs-tools
          unsquashfs -lc finaryx.snap > content.txt
          for f in meta/snap.yaml usr/bin/finaryx \
                   usr/share/glib-2.0/schemas/gschemas.compiled \
                   usr/share/locale/de/LC_MESSAGES/finaryx.mo \
                   usr/share/locale/zh_CN/LC_MESSAGES/finaryx.mo; do
            grep -q "squashfs-root/$f\$" content.txt || { echo "Missing: $f"; exit 1; }
          done
          grep -q 'squashfs-root/meta/gui/.*\.desktop$' content.txt || { echo "Missing: desktop file"; exit 1; }
          unsquashfs -cat finaryx.snap meta/snap.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: finaryx.snap

  release:
    name: Publication
    needs: [flatpak, snap]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then TAG="v$version"; else TAG="$GITHUB_REF_NAME"; fi
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG does not match the version of Cargo.toml (v$version)."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Publish from main only."; exit 1
          fi
          # X.Y.Z-beta: published as a pre-release, "(bêta)" in the title.
          case "$version" in
            *-beta*) title="Finaryx ${version%%-beta*} (bêta)"; pre=--prerelease ;;
            *) title="Finaryx $version"; pre= ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" $pre --notes-file .github/release-notes.md
          else
            gh release create "$TAG" --title "$title" $pre \
              --notes-file .github/release-notes.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/finaryx.flatpak dist/finaryx.snap --clobber
