# Builds the Flatpak with the publication manifest (offline: crates from
# build-aux/cargo-sources.json), on the checked-out commit instead of the
# release tag. The bundle is kept as an artifact of the run and, for a
# v* tag, attached to the GitHub release.
#
# Publishing a version: Actions > Flatpak > Run workflow on main, with the
# tag (e.g. v0.1.0). The run creates the tag and the release (text:
# .github/release-notes.md) and attaches the bundle. It is started by hand
# by the owner, never by a Claude session.
name: Flatpak

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish (e.g. v0.1.0); empty: build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Manifest for this commit
        run: |
          python3 - <<'PY'
          import json
          src = "build-aux/io.github.docteurscience.Finaryx.json"
          m = json.load(open(src))
          for module in m["modules"]:
              if module["name"] == "finaryx":
                  module["sources"] = [{"type": "dir", "path": ".."}, "cargo-sources.json"]
          json.dump(m, open("build-aux/ci.json", "w"), indent=2)
          PY

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: finaryx.flatpak
          manifest-path: build-aux/ci.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG does not match the version of Cargo.toml (v$version)."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Publish from main only."; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" --title "Finaryx $version" \
              --notes-file .github/release-notes.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" finaryx.flatpak --clobber
