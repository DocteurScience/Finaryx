# Builds the Flatpak with the publication manifest (offline: crates from
# build-aux/cargo-sources.json), on the checked-out commit instead of the
# release tag. The bundle is kept as an artifact of the run and, for a
# v* tag, attached to the GitHub release.
name: Flatpak

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Manifest for this commit
        run: |
          python3 - <<'PY'
          import json
          src = "build-aux/io.github.docteurscience.Finaryx.json"
          m = json.load(open(src))
          for module in m["modules"]:
              if module["name"] == "finaryx":
                  module["sources"] = [{"type": "dir", "path": ".."}, "cargo-sources.json"]
          json.dump(m, open("build-aux/ci.json", "w"), indent=2)
          PY

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: finaryx.flatpak
          manifest-path: build-aux/ci.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Finaryx ${GITHUB_REF_NAME#v}" --notes "Paquet Flatpak : finaryx.flatpak (flatpak install --user finaryx.flatpak)."
          gh release upload "$GITHUB_REF_NAME" finaryx.flatpak --clobber
