<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Finaryx — Comptes (étroit)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/aa5a12024ce462d0d7fcc343b35e4c84">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="display:flex;flex-direction:column;min-height:1200px;background:var(--win);font-family:'Adwaita Sans',Inter,system-ui,sans-serif;font-size:15px;color:var(--fg)">
  <header style="height:56px;box-sizing:border-box;padding:0 6px;display:flex;align-items:center;gap:4px;background:var(--head);border-bottom:1px solid var(--line2)">
    <a href="Import.dc.html" class="flat" aria-label="Importer un CSV" title="Importer un CSV" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>
    <div style="flex:1;text-align:center;line-height:1.25;min-width:0">
      <div style="font-weight:700">Comptes</div>
      <div style="font-size:12px;color:var(--dim)">4 comptes · 3 banques</div>
    </div>
    <button type="button" class="flat" aria-label="Menu principal" title="Menu principal" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>
  <main style="flex:1;box-sizing:border-box;padding:16px 12px 24px;display:flex;flex-direction:column;gap:20px">
    <section class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="line-height:1.3"><div style="font-size:12px;color:var(--dim)">Solde total · 4 comptes</div><div style="font-size:30px;font-weight:700">11 968,58 €</div></div>
      <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px" role="img" aria-label="Répartition du solde entre les comptes"><sc-for list="{{shares}}" as="s" hint-placeholder-count="4"><div title="{{s.tip}}" style="flex:{{s.flex}};background:{{s.color}}"></div></sc-for></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:15px;font-weight:700">Vos comptes</h2><a href="Import.dc.html" class="flat" style="display:inline-flex;align-items:center;height:44px;padding:0 10px;font-size:14px;font-weight:500;color:var(--accent)">Ajouter</a></div>
      <div class="card" style="overflow:hidden">
        <sc-for list="{{accounts}}" as="a" hint-placeholder-count="4">
          <a href="CompteDetail.dc.html" class="listrow" style="display:flex;align-items:center;gap:12px;min-height:72px;padding:8px 14px;border-top:1px solid var(--line)">
            <span style="flex:none;width:40px;height:40px;border-radius:50%;background:{{a.color}};color:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">{{a.ini}}</span>
            <span style="flex:1;min-width:0;line-height:1.3"><span style="display:block;font-weight:500">{{a.name}}</span><span style="display:block;font-size:12px;color:var(--dim)">{{a.bank}} · {{a.ops}} opérations</span></span>
            <span style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.3"><span style="font-weight:700;font-variant-numeric:tabular-nums">{{a.bal}}</span><span style="font-size:12px;color:var(--dim)">{{a.status}}</span></span>
          </a>
        </sc-for>
      </div>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0;font-size:15px;font-weight:700">Historique des imports</h2>
      <div class="card" style="overflow:hidden">
        <sc-for list="{{imports}}" as="i" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 14px;border-top:1px solid var(--line)">
            <span style="flex:1;min-width:0;line-height:1.3"><span style="display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{i.file}}</span><span style="font-size:12px;color:var(--dim)">{{i.date}} · {{i.acc}}</span></span>
            <span style="font-size:13px;color:var(--fg2)">{{i.n}} nouvelles</span>
          </div>
        </sc-for>
      </div>
      <a href="Import.dc.html" style="display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:var(--suggest);color:#ffffff;font-weight:700">Importer un CSV</a>
    </section>
  </main>
  <nav aria-label="Navigation principale" style="position:sticky;bottom:0;display:flex;background:var(--head);border-top:1px solid var(--line2)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" aria-current="{{t.current}}" style="flex:1;min-width:0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;{{t.tone}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const fmt = (n, d = 2) => n.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
    const eur = (n, d = 2) => fmt(n, d) + '\u00a0€';
    const TABS = [
      ['Main.dc.html', 'Aperçu', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
      ['Mois.dc.html', 'Mois', 'M5 5h14v15H5zM5 10h14M9 3v4M15 3v4'],
      ['Cumul.dc.html', 'Cumul', 'M5 20V10M12 20V4M19 20v-7'],
      ['Previsions.dc.html', 'Prévisions', 'M3 17l6-6 4 4 8-8M15 7h6v6'],
      ['Comptes.dc.html', 'Comptes', 'M3 9l9-5 9 5M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18']
    ];
    const ACTIVE = 4;
    const tabs = TABS.map(([href, label, icon], i) => ({
      href, label, icon, current: i === ACTIVE ? 'page' : 'false',
      tone: i === ACTIVE ? 'color:var(--accent);font-weight:700' : 'color:var(--dim2)'
    }));
    const seg = (labels, on) => labels.map((label, i) => ({ label, pressed: i === on ? 'true' : 'false',
      tone: i === on ? 'background:var(--segon);color:var(--fg);box-shadow:var(--segsh)' : 'background:transparent;color:var(--fg2)' }));
    const accounts = [
      { name: 'Compte courant', bank: 'Banque Populaire', ops: 268, bal: 2871.46, status: 'À jour', color: 'var(--a1)', ini: 'BP' },
      { name: 'Livret A', bank: 'Banque Populaire', ops: 24, bal: 6530.00, status: 'À jour', color: 'var(--a2)', ini: 'BP' },
      { name: 'Compte joint', bank: 'Boursorama', ops: 197, bal: 1954.27, status: 'Octobre à importer', color: 'var(--a3)', ini: 'BO' },
      { name: 'Revolut', bank: 'Revolut', ops: 113, bal: 612.85, status: 'À mettre à jour', color: 'var(--a4)', ini: 'RE' }
    ];
    const total = accounts.reduce((a, c) => a + c.bal, 0);
    const shares = accounts.map(a => ({ flex: a.bal.toFixed(0), color: a.color, tip: a.name + ' : ' + eur(a.bal) + ' (' + fmt(a.bal / total * 100, 0) + ' %)' }));
    const acc2 = accounts.map(a => ({ ...a, bal: eur(a.bal) }));
    const imports = [
      { file: 'bp_courant_octobre.csv', date: '2 nov.', acc: 'Courant', n: 88 },
      { file: 'livret-a_2026.csv', date: '28 oct.', acc: 'Livret A', n: 2 },
      { file: 'revolut_2026-10.csv', date: '12 oct.', acc: 'Revolut', n: 14 }
    ];
    return { tabs, shares, accounts: acc2, imports };
  }
}
</script>
</body>
</html>
