<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f5f4"/>
    </linearGradient>
  </defs>
  <!-- Tile with its thickness (GNOME app icon style). -->
  <rect x="8" y="16" width="112" height="104" rx="22" fill="#1a5fb4"/>
  <rect x="8" y="8" width="112" height="104" rx="22" fill="url(#face)"/>
  <!-- Statement card. -->
  <rect x="22" y="24" width="84" height="72" rx="10" fill="#1c71d8" opacity="0.35"/>
  <rect x="22" y="20" width="84" height="72" rx="10" fill="url(#paper)"/>
  <!-- Monthly spending: stacked columns in the data colours. -->
  <rect x="32" y="62" width="12" height="22" rx="2" fill="#2a78d6"/>
  <rect x="32" y="54" width="12" height="7" rx="1.5" fill="#eb6834"/>
  <rect x="50" y="56" width="12" height="28" rx="2" fill="#2a78d6"/>
  <rect x="50" y="46" width="12" height="9" rx="1.5" fill="#eb6834"/>
  <rect x="68" y="60" width="12" height="24" rx="2" fill="#2a78d6"/>
  <rect x="68" y="51" width="12" height="8" rx="1.5" fill="#eb6834"/>
  <rect x="68" y="45" width="12" height="5" rx="1.5" fill="#1baf7a"/>
  <!-- Forecast: dashed line towards the next months. -->
  <path d="M38 44 L56 36 L74 38" fill="none" stroke="#241f31" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 38 L94 28" fill="none" stroke="#241f31" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="94" cy="28" r="4.5" fill="#ffffff" stroke="#241f31" stroke-width="2.5"/>
  <circle cx="74" cy="38" r="3.5" fill="#241f31"/>
</svg>
